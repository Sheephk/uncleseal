
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marathon Pace Calculator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #e67e22;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 { text-align: center; color: var(--primary-color); }
        .control-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            background: #f9f9f9;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
        }
        label { font-weight: bold; margin-bottom: 5px; font-size: 0.9em; }
        input, select {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-calc { background-color: var(--primary-color); color: white; }
        .btn-export { background-color: #27ae60; color: white; }
        button:hover { opacity: 0.8; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }
        th { background-color: var(--primary-color); color: white; }
        tr:nth-child(even) { background-color: #fafafa; }
        .highlight-25 { border-left: 5px solid #3498db; }
        .highlight-35 { border-left: 5px solid var(--accent-color); }
    </style>
</head>
<body>

<div class="container">
    <h1>🏃 Marathon Pace Calculator By UncleSeal-V1</h1>
<h2 style="font-size: 1.0em; font-weight: normal; color: #7f8c8d; margin-top: -10px; margin-bottom: 20px;">
    Maintained a consistent pace for the initial 25 km, with a noticeable slowdown from 26–35 km and a further reduction in speed during the final stretch (36 km–Finish)
</h2>
    
    <div class="control-panel">
        <div class="input-group">
            <label>Target Finish Time (HH:MM:SS)</label>
            <input type="text" id="targetTime" value="04:00:00" placeholder="04:00:00">
        </div>
        <div class="input-group">
            <label>Start Time (Race Start) (HH:MM:SS)</label>
            <input type="time" id="startTime" value="05:00">
        </div>
        <div class="input-group">
            <label>25k-35k Slowdown (sec)　　　　　　　</label>
            <input type="number" id="drop1" value="4">
        </div>
        <div class="input-group">
            <label>35k-Finish Slowdown (sec)　　　　　　</label>
            <input type="number" id="drop2" value="5">
        </div>
        <div class="input-group">
            <label>Display Interval</label>
            <select id="displayMode">
                <option value="1">Every 1 KM</option>
                <option value="5">Every 5 KM</option>
            </select>
        </div>
    </div>

    <div class="btn-group">
        <button class="btn-calc" onclick="calculatePace()">Update Calculator</button>
        <button class="btn-export" onclick="exportToExcel()">Download EXCEL Plan</button>
    </div>

    <table id="paceTable">
        <thead>
            <tr>
                <th>Distance (KM)</th>
                <th>Current Pace</th>
                <th>Split Time</th>
                <th>Estimated TOD</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            </tbody>
    </table>
</div>

<script>
    function timeToSeconds(timeStr) {
        const parts = timeStr.split(':');
        return (+parts[0]) * 3600 + (+parts[1]) * 60 + (+parts[2] || 0);
    }

    function secondsToTime(secs) {
        const h = Math.floor(secs / 3600);
        const m = Math.floor((secs % 3600) / 60);
        const s = Math.floor(secs % 60);
        return [h, m, s].map(v => v < 10 ? "0" + v : v).join(":");
    }

    function calculatePace() {
        const targetSecs = timeToSeconds(document.getElementById('targetTime').value);
        const drop1 = parseInt(document.getElementById('drop1').value);
        const drop2 = parseInt(document.getElementById('drop2').value);
        const startTimeStr = document.getElementById('startTime').value;
        const displayMode = parseInt(document.getElementById('displayMode').value);
        
        // Math Logic: Calculate Base Pace
        // Total Seconds = Pace*25 + (Pace+Drop1)*10 + (Pace+Drop1+Drop2)*7.195
        const basePace = (targetSecs - (drop1 * 10) - ((drop1 + drop2) * 7.195)) / 42.195;
        
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        
        let cumulativeSecs = 0;
        const startTimestamp = new Date(`2026-04-20T${startTimeStr}:00`);

        for (let i = 1; i <= 43; i++) {
            let distance = i;
            let currentPace = basePace;
            
            if (i > 42) distance = 42.195;

            // Determine pace adjustment
            if (distance > 25 && distance <= 35) {
                currentPace = basePace + drop1;
            } else if (distance > 35) {
                currentPace = basePace + drop1 + drop2;
            }

            // Add time for current kilometer
            const stepSecs = (distance === 42.195) ? (currentPace * 0.195) : currentPace;
            cumulativeSecs += stepSecs;

            // Display Logic
            if (i % displayMode === 0 || distance === 42.195) {
                const row = document.createElement('tr');
                if (distance > 25 && distance <= 35) row.className = 'highlight-25';
                if (distance > 35) row.className = 'highlight-35';

                const arrivalTime = new Date(startTimestamp.getTime() + cumulativeSecs * 1000);
                
                row.innerHTML = `
                    <td>${distance === 42.195 ? 'FINISH (42.195)' : distance + ' KM'}</td>
                    <td>${secondsToTime(currentPace).substring(3)} /km</td>
                    <td>${secondsToTime(cumulativeSecs)}</td>
                    <td>${arrivalTime.toTimeString().substring(0, 8)}</td>
                `;
                tableBody.appendChild(row);
                if (distance === 42.195) break;
            } else {
                if (distance === 42.195) break;
            }
        }
    }

    function exportToExcel() {
        const table = document.getElementById("paceTable");
        const wb = XLSX.utils.table_to_book(table, {sheet: "Marathon Pace Plan"});
        XLSX.writeFile(wb, "Marathon_Pace_Plan.xlsx");
    }

    // Initial run
    calculatePace();
</script>

</body>
</html>
